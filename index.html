<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dream eSports Admin</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #080b12;
      color: white;
      min-height: 100vh;
    }

    .login-page {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: #111722;
      border: 1px solid #273044;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .logo span {
      color: #00e5ff;
    }

    .subtitle {
      text-align: center;
      color: #8e99aa;
      margin-bottom: 28px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      background: #080c14;
      color: white;
      border: 1px solid #303a4e;
      border-radius: 10px;
      outline: none;
    }

    input:focus {
      border-color: #00e5ff;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #00e5ff;
      color: #001014;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: .9;
    }

    #error {
      margin-top: 15px;
      color: #ff5c5c;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
    }

    #app {
      display: none;
    }

    header {
      background: #111722;
      border-bottom: 1px solid #273044;
      padding: 18px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 22px;
    }

    header span {
      color: #00e5ff;
    }

    .logout {
      width: auto;
      padding: 10px 18px;
      background: #ff4757;
      color: white;
      font-size: 14px;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 25px;
    }

    .welcome {
      margin-bottom: 25px;
    }

    .welcome h2 {
      margin-bottom: 5px;
    }

    .welcome p {
      color: #8e99aa;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 30px;
    }

    .stat {
      background: #111722;
      border: 1px solid #273044;
      border-radius: 15px;
      padding: 20px;
    }

    .stat p {
      color: #8e99aa;
      margin-bottom: 10px;
    }

    .stat h3 {
      font-size: 30px;
      color: #00e5ff;
    }

    .section-title {
      margin-bottom: 15px;
    }

    .tournament-list {
      display: grid;
      gap: 15px;
    }

    .tournament {
      background: #111722;
      border: 1px solid #273044;
      border-radius: 15px;
      padding: 20px;
    }

    .tournament h3 {
      margin-bottom: 12px;
      color: #00e5ff;
    }

    .info {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      color: #c4ccda;
      font-size: 14px;
    }

    .refresh {
      width: auto;
      margin-bottom: 15px;
      background: #202a3c;
      color: white;
    }

    @media(max-width:700px) {
      .stats {
        grid-template-columns: 1fr;
      }

      .info {
        grid-template-columns: 1fr;
      }

      header {
        padding: 15px;
      }

      .container {
        padding: 15px;
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN -->
  <div id="loginPage" class="login-page">

    <div class="login-box">

      <div class="logo">
        Dream <span>eSports</span>
      </div>

      <div class="subtitle">
        Admin Panel
      </div>

      <input
        type="email"
        id="email"
        placeholder="Admin Email"
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
      >

      <button onclick="loginAdmin()">
        LOGIN
      </button>

      <div id="error"></div>

    </div>

  </div>


  <!-- ADMIN APP -->
  <div id="app">

    <header>

      <h1>
        Dream <span>eSports</span> Admin
      </h1>

      <button class="logout" onclick="logoutAdmin()">
        Logout
      </button>

    </header>


    <div class="container">

      <div class="welcome">
        <h2>Dashboard</h2>
        <p>Manage your Dream eSports tournaments.</p>
      </div>


      <div class="stats">

        <div class="stat">
          <p>Total Tournaments</p>
          <h3 id="totalTournaments">0</h3>
        </div>

        <div class="stat">
          <p>Open Tournaments</p>
          <h3 id="openTournaments">0</h3>
        </div>

        <div class="stat">
          <p>Total Players</p>
          <h3 id="totalPlayers">0</h3>
        </div>

      </div>


      <h2 class="section-title">
        Tournaments
      </h2>

      <button
        class="refresh"
        onclick="loadTournaments()">
        Refresh
      </button>

      <div
        id="tournamentList"
        class="tournament-list">
      </div>

    </div>

  </div>


  <!-- FIREBASE -->
  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


    import {
      getAuth,
      onAuthStateChanged,
      signInWithEmailAndPassword,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


    import {
      getFirestore,
      collection,
      getDocs
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


    const firebaseConfig = {

      apiKey:
        "AIzaSyAeZnZ4tNZ7qY0cjfRdBq4J_Eahop37Qn4",

      authDomain:
        "dream-esports-51780.firebaseapp.com",

      projectId:
        "dream-esports-51780",

      storageBucket:
        "dream-esports-51780.firebasestorage.app",

      messagingSenderId:
        "959473187247",

      appId:
        "1:959473187247:web:ba4a80a6da5b52d5fcd75a",

      measurementId:
        "G-DP6X3STGN0"
    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);


    /* LOGIN */

    window.loginAdmin = async function() {

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      const errorBox =
        document.getElementById("error");


      errorBox.innerText = "";


      if (!email || !password) {

        errorBox.innerText =
          "Email and password required.";

        return;
      }


      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

      } catch (error) {

        console.error(error);

        errorBox.innerText =
          "Login failed:\n" +
          error.code +
          "\n" +
          error.message;
      }

    };


    /* LOGOUT */

    window.logoutAdmin = async function() {

      await signOut(auth);

    };


    /* AUTH CHECK */

    onAuthStateChanged(auth, (user) => {

      const loginPage =
        document.getElementById("loginPage");

      const appPage =
        document.getElementById("app");


      if (user) {

        loginPage.style.display = "none";

        appPage.style.display = "block";

        loadTournaments();

      } else {

        loginPage.style.display = "flex";

        appPage.style.display = "none";

      }

    });


    /* TOURNAMENT LOAD */

    window.loadTournaments = async function() {

      const list =
        document.getElementById("tournamentList");


      list.innerHTML =
        "<p>Loading tournaments...</p>";


      try {

        const snapshot =
          await getDocs(
            collection(db, "Tournaments")
          );


        let total = snapshot.size;

        let open = 0;

        let players = 0;


        list.innerHTML = "";


        snapshot.forEach((doc) => {

          const data = doc.data();


          const name =
            data.Name || "Unnamed Tournament";

          const game =
            data.Game || "Free Fire";

          const mode =
            data.Mode || "-";

          const date =
            data.Date || "-";

          const time =
            data.Time || "-";

          const maxPlayers =
            data.Maxplayers || 0;

          const currentPlayers =
            data.Players || 0;

          const status =
            data["Status "] ||
            data.Status ||
            "Open";


          if (
            String(status).toLowerCase()
            === "open"
          ) {

            open++;

          }


          players +=
            Number(currentPlayers) || 0;


          const card =
            document.createElement("div");


          card.className =
            "tournament";


          card.innerHTML = `

            <h3>${name}</h3>

            <div class="info">

              <div>
                Game: ${game}
              </div>

              <div>
                Mode: ${mode}
              </div>

              <div>
                Date: ${date}
              </div>

              <div>
                Time: ${time}
              </div>

              <div>
                Players: ${currentPlayers}/${maxPlayers}
              </div>

              <div>
                Status: ${status}
              </div>

            </div>

          `;


          list.appendChild(card);

        });


        document.getElementById(
          "totalTournaments"
        ).innerText = total;


        document.getElementById(
          "openTournaments"
        ).innerText = open;


        document.getElementById(
          "totalPlayers"
        ).innerText = players;


        if (total === 0) {

          list.innerHTML =
            "<p>No tournaments found.</p>";

        }


      } catch (error) {

        console.error(error);

        list.innerHTML =
          "<p>Failed to load tournaments: " +
          error.message +
          "</p>";

      }

    };

  </script>

</body>
</html>
