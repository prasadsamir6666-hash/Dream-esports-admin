<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dream eSports Admin</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #070a10;
      color: #ffffff;
      min-height: 100vh;
    }

    /* LOGIN */

    #loginPage {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: #101621;
      border: 1px solid #293348;
      border-radius: 22px;
      padding: 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,.55);
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .logo span {
      color: #00e5ff;
    }

    .subtitle {
      text-align: center;
      color: #8d98aa;
      margin-bottom: 28px;
    }

    input {
      width: 100%;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 11px;
      border: 1px solid #303b50;
      background: #080c13;
      color: white;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #00e5ff;
    }

    .login-btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 11px;
      background: #00e5ff;
      color: #001015;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-btn:disabled {
      opacity: .6;
    }

    #loginError {
      margin-top: 15px;
      color: #ff6262;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
    }

    /* ADMIN */

    #adminPage {
      display: none;
    }

    header {
      background: #101621;
      border-bottom: 1px solid #293348;
      padding: 18px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      font-size: 22px;
    }

    header h1 span {
      color: #00e5ff;
    }

    .logout-btn {
      width: auto;
      padding: 10px 18px;
      border: none;
      border-radius: 9px;
      background: #ff4757;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      margin: auto;
      padding: 25px;
    }

    .welcome {
      margin-bottom: 25px;
    }

    .welcome h2 {
      margin-bottom: 6px;
    }

    .welcome p {
      color: #8d98aa;
    }

    /* STATS */

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: #101621;
      border: 1px solid #293348;
      border-radius: 16px;
      padding: 22px;
    }

    .stat-card p {
      color: #8d98aa;
      margin-bottom: 10px;
    }

    .stat-card h3 {
      font-size: 32px;
      color: #00e5ff;
    }

    /* TOURNAMENT */

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .refresh-btn {
      width: auto;
      padding: 10px 17px;
      border: none;
      border-radius: 9px;
      background: #202a3c;
      color: white;
      cursor: pointer;
    }

    #tournamentList {
      display: grid;
      gap: 15px;
    }

    .tournament-card {
      background: #101621;
      border: 1px solid #293348;
      border-radius: 16px;
      padding: 20px;
    }

    .tournament-card h3 {
      color: #00e5ff;
      margin-bottom: 15px;
      font-size: 20px;
    }

    .tournament-info {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      color: #c5ccda;
      font-size: 14px;
    }

    .status-open {
      color: #42e695;
      font-weight: bold;
    }

    .status-closed {
      color: #ff6262;
      font-weight: bold;
    }

    .loading {
      color: #8d98aa;
      padding: 20px 0;
    }

    /* MOBILE */

    @media (max-width: 700px) {

      header {
        padding: 15px;
      }

      header h1 {
        font-size: 18px;
      }

      .container {
        padding: 15px;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .tournament-info {
        grid-template-columns: 1fr;
      }

      .section-head {
        align-items: flex-start;
        gap: 10px;
      }

    }
  </style>
</head>

<body>


  <!-- LOGIN PAGE -->

  <div id="loginPage">

    <div class="login-box">

      <div class="logo">
        Dream <span>eSports</span>
      </div>

      <div class="subtitle">
        Admin Panel
      </div>

      <input
        type="email"
        id="email"
        placeholder="Admin Email"
        autocomplete="email"
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
        autocomplete="current-password"
      >

      <button
        class="login-btn"
        id="loginButton"
        onclick="loginAdmin()"
      >
        LOGIN
      </button>

      <div id="loginError"></div>

    </div>

  </div>


  <!-- ADMIN PAGE -->

  <div id="adminPage">

    <header>

      <h1>
        Dream <span>eSports</span> Admin
      </h1>

      <button
        class="logout-btn"
        onclick="logoutAdmin()"
      >
        Logout
      </button>

    </header>


    <main class="container">

      <div class="welcome">

        <h2>Dashboard</h2>

        <p>
          Manage your Dream eSports tournaments.
        </p>

      </div>


      <!-- STATS -->

      <div class="stats">

        <div class="stat-card">

          <p>Total Tournaments</p>

          <h3 id="totalTournaments">
            0
          </h3>

        </div>


        <div class="stat-card">

          <p>Open Tournaments</p>

          <h3 id="openTournaments">
            0
          </h3>

        </div>


        <div class="stat-card">

          <p>Total Players</p>

          <h3 id="totalPlayers">
            0
          </h3>

        </div>

      </div>


      <!-- TOURNAMENTS -->

      <div class="section-head">

        <h2>
          Tournaments
        </h2>

        <button
          class="refresh-btn"
          onclick="loadTournaments()"
        >
          Refresh
        </button>

      </div>


      <div id="tournamentList">

        <p class="loading">
          Loading tournaments...
        </p>

      </div>

    </main>

  </div>


  <!-- FIREBASE -->

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


    import {
      getAuth,
      onAuthStateChanged,
      signInWithEmailAndPassword,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


    import {
      getFirestore,
      collection,
      getDocs
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


    /* NEW ADMIN WEB APP CONFIG */

    const firebaseConfig = {

      apiKey:
        "AIzaSyAeZnZ4tNZ7qY0cjfRdBq4J_Eahop37Qn4",

      authDomain:
        "dream-esports-51780.firebaseapp.com",

      projectId:
        "dream-esports-51780",

      storageBucket:
        "dream-esports-51780.firebasestorage.app",

      messagingSenderId:
        "959473187247",

      appId:
        "1:959473187247:web:4a83c76273177002fcd75a",

      measurementId:
        "G-1G2Q3EK2ZD"

    };


    /* INITIALIZE */

    const app =
      initializeApp(firebaseConfig);

    const auth =
      getAuth(app);

    const db =
      getFirestore(app);


    /* LOGIN */

    window.loginAdmin = async function() {

      const email =
        document.getElementById("email")
          .value
          .trim();

      const password =
        document.getElementById("password")
          .value;

      const errorBox =
        document.getElementById("loginError");

      const button =
        document.getElementById("loginButton");


      errorBox.innerText = "";


      if (!email || !password) {

        errorBox.innerText =
          "Email and password required.";

        return;

      }


      button.disabled = true;

      button.innerText = "LOGGING IN...";


      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );


      } catch (error) {

        console.error(
          "Firebase Login Error:",
          error
        );


        errorBox.innerText =
          "Login failed:\n" +
          error.code +
          "\n" +
          error.message;


        button.disabled = false;

        button.innerText = "LOGIN";

      }

    };


    /* LOGOUT */

    window.logoutAdmin = async function() {

      try {

        await signOut(auth);

      } catch (error) {

        console.error(error);

      }

    };


    /* AUTH STATE */

    onAuthStateChanged(
      auth,
      (user) => {

        const loginPage =
          document.getElementById("loginPage");

        const adminPage =
          document.getElementById("adminPage");


        if (user) {

          loginPage.style.display =
            "none";

          adminPage.style.display =
            "block";


          loadTournaments();

        } else {

          loginPage.style.display =
            "flex";

          adminPage.style.display =
            "none";

        }

      }
    );


    /* LOAD TOURNAMENTS */

    window.loadTournaments =
      async function() {

        const list =
          document.getElementById(
            "tournamentList"
          );


        list.innerHTML =
          '<p class="loading">Loading tournaments...</p>';


        try {

          const snapshot =
            await getDocs(
              collection(
                db,
                "Tournaments"
              )
            );


          let total =
            snapshot.size;

          let open =
            0;

          let players =
            0;


          list.innerHTML = "";


          snapshot.forEach(
            (doc) => {

              const data =
                doc.data();


              const name =
                data.Name ||
                "Unnamed Tournament";


              const game =
                data.Game ||
                "Free Fire";


              const mode =
                data.Mode ||
                "-";


              const date =
                data.Date ||
                "-";


              const time =
                data.Time ||
                "-";


              const maxPlayers =
                data.Maxplayers ||
                0;


              const currentPlayers =
                data.Players ||
                0;


              const status =
                data["Status "] ||
                data.Status ||
                "Open";


              const statusText =
                String(status);


              if (
                statusText
                  .toLowerCase() ===
                "open"
              ) {

                open++;

              }


              players +=
                Number(
                  currentPlayers
                ) || 0;


              const card =
                document.createElement(
                  "div"
                );


              card.className =
                "tournament-card";


              const statusClass =
                statusText
                  .toLowerCase() ===
                "open"
                  ? "status-open"
                  : "status-closed";


              card.innerHTML = `

                <h3>
                  ${name}
                </h3>

                <div class="tournament-info">

                  <div>
                    <b>Game:</b>
                    ${game}
                  </div>

                  <div>
                    <b>Mode:</b>
                    ${mode}
                  </div>

                  <div>
                    <b>Date:</b>
                    ${date}
                  </div>

                  <div>
                    <b>Time:</b>
                    ${time}
                  </div>

                  <div>
                    <b>Players:</b>
                    ${currentPlayers}/${maxPlayers}
                  </div>

                  <div>
                    <b>Status:</b>
                    <span class="${statusClass}">
                      ${statusText}
                    </span>
                  </div>

                </div>

              `;


              list.appendChild(card);

            }
          );


          document.getElementById(
            "totalTournaments"
          ).innerText =
            total;


          document.getElementById(
            "openTournaments"
          ).innerText =
            open;


          document.getElementById(
            "totalPlayers"
          ).innerText =
            players;


          if (total === 0) {

            list.innerHTML =
              '<p class="loading">No tournaments found.</p>';

          }


        } catch (error) {

          console.error(
            "Firestore Error:",
            error
          );


          list.innerHTML =
            `<p class="loading">
              Failed to load tournaments:
              ${error.message}
            </p>`;

        }

      };

  </script>

</body>
</html>
