<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dream eSports Admin</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #070707;
      color: white;
      min-height: 100vh;
    }

    button {
      cursor: pointer;
    }

    /* ================= LOGIN ================= */

    #loginScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background:
        radial-gradient(circle at top, #252525, #070707 55%);
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: #111;
      border: 1px solid #292929;
      border-radius: 22px;
      padding: 35px 25px;
      text-align: center;
      box-shadow: 0 20px 70px rgba(0,0,0,.7);
    }

    .logo {
      width: 78px;
      height: 78px;
      margin: auto;
      margin-bottom: 18px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg,#ffb300,#ff6f00);
      color: #111;
      font-size: 28px;
      font-weight: bold;
    }

    .login-box h1 {
      font-size: 25px;
      margin-bottom: 7px;
    }

    .login-subtitle {
      color: #888;
      font-size: 13px;
      margin-bottom: 28px;
    }

    input {
      width: 100%;
      padding: 15px;
      margin-bottom: 13px;
      border-radius: 12px;
      border: 1px solid #333;
      background: #191919;
      color: white;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #ff9800;
    }

    .login-btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg,#ffb300,#ff6f00);
      color: #111;
      font-size: 15px;
      font-weight: bold;
    }

    #loginMessage {
      margin-top: 14px;
      color: #ff7777;
      font-size: 13px;
    }


    /* ================= ADMIN ================= */

    #adminScreen {
      display: none;
    }

    .topbar {
      height: 70px;
      padding: 0 20px;
      background: #111;
      border-bottom: 1px solid #292929;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .brand {
      font-size: 20px;
      font-weight: bold;
    }

    .brand span {
      color: #ff9800;
    }

    .logout-btn {
      width: auto;
      padding: 10px 16px;
      border: 1px solid #444;
      border-radius: 10px;
      background: #202020;
      color: white;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      margin: auto;
      padding: 25px 18px 50px;
    }

    .welcome {
      margin-bottom: 25px;
    }

    .welcome h2 {
      font-size: 26px;
      margin-bottom: 7px;
    }

    .welcome p {
      color: #888;
      font-size: 13px;
    }


    /* ================= STATS ================= */

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit,minmax(180px,1fr));
      gap: 15px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: #111;
      border: 1px solid #292929;
      border-radius: 17px;
      padding: 20px;
    }

    .stat-title {
      color: #888;
      font-size: 13px;
      margin-bottom: 12px;
    }

    .stat-number {
      font-size: 30px;
      font-weight: bold;
      color: #ff9800;
    }


    /* ================= SECTION ================= */

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .section-title h3 {
      font-size: 20px;
    }

    .refresh-btn {
      width: auto;
      padding: 9px 14px;
      border: 1px solid #333;
      border-radius: 9px;
      background: #171717;
      color: #ddd;
    }


    /* ================= TOURNAMENT ================= */

    #tournamentList {
      display: grid;
      grid-template-columns: repeat(auto-fit,minmax(260px,1fr));
      gap: 15px;
    }

    .tournament-card {
      background: #111;
      border: 1px solid #292929;
      border-radius: 17px;
      padding: 20px;
      transition: .2s;
    }

    .tournament-card:hover {
      border-color: #ff9800;
    }

    .tournament-name {
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .game {
      color: #ff9800;
      font-size: 13px;
      margin-bottom: 15px;
    }

    .info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .info-box {
      background: #191919;
      border-radius: 10px;
      padding: 10px;
    }

    .info-label {
      color: #777;
      font-size: 10px;
      margin-bottom: 5px;
    }

    .info-value {
      font-size: 13px;
      font-weight: bold;
    }

    .status {
      display: inline-block;
      margin-top: 15px;
      padding: 6px 10px;
      border-radius: 20px;
      background: #183b20;
      color: #66e27b;
      font-size: 11px;
    }

    .empty {
      text-align: center;
      padding: 40px 20px;
      background: #111;
      border: 1px solid #292929;
      border-radius: 17px;
      color: #777;
    }

    .loading {
      text-align: center;
      color: #888;
      padding: 30px;
    }

    @media(max-width:500px) {

      .brand {
        font-size: 17px;
      }

      .welcome h2 {
        font-size: 23px;
      }

      .stats {
        grid-template-columns: 1fr 1fr;
      }

      .stat-number {
        font-size: 25px;
      }

    }
  </style>
</head>


<body>


<!-- ================= LOGIN ================= -->

<div id="loginScreen">

  <div class="login-box">

    <div class="logo">
      DE
    </div>

    <h1>Dream eSports</h1>

    <div class="login-subtitle">
      Admin Control Panel
    </div>

    <input
      type="email"
      id="email"
      placeholder="Admin Email"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
    >

    <button
      class="login-btn"
      onclick="loginAdmin()"
    >
      LOGIN TO ADMIN
    </button>

    <div id="loginMessage"></div>

  </div>

</div>



<!-- ================= ADMIN ================= -->

<div id="adminScreen">


  <div class="topbar">

    <div class="brand">
      Dream <span>eSports</span> Admin
    </div>

    <button
      class="logout-btn"
      onclick="logoutAdmin()"
    >
      Logout
    </button>

  </div>



  <div class="container">


    <div class="welcome">

      <h2>
        Admin Dashboard
      </h2>

      <p id="adminEmail">
        Admin
      </p>

    </div>



    <!-- STATS -->

    <div class="stats">

      <div class="stat-card">

        <div class="stat-title">
          TOTAL TOURNAMENTS
        </div>

        <div
          class="stat-number"
          id="totalTournaments"
        >
          0
        </div>

      </div>


      <div class="stat-card">

        <div class="stat-title">
          OPEN TOURNAMENTS
        </div>

        <div
          class="stat-number"
          id="openTournaments"
        >
          0
        </div>

      </div>


      <div class="stat-card">

        <div class="stat-title">
          TOTAL PLAYERS
        </div>

        <div
          class="stat-number"
          id="totalPlayers"
        >
          0
        </div>

      </div>

    </div>



    <!-- TOURNAMENTS -->

    <div class="section-title">

      <h3>
        Tournaments
      </h3>

      <button
        class="refresh-btn"
        onclick="loadTournaments()"
      >
        Refresh
      </button>

    </div>


    <div id="tournamentList">

      <div class="loading">
        Loading tournaments...
      </div>

    </div>


  </div>

</div>



<!-- ================= FIREBASE ================= -->

<script type="module">

  import {
    initializeApp
  }
  from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


  import {
    getAuth,
    onAuthStateChanged,
    signInWithEmailAndPassword,
    signOut
  }
  from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


  import {
    getFirestore,
    collection,
    getDocs
  }
  from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";



  /* FIREBASE CONFIG */

  const firebaseConfig = {

    apiKey:
      "AIzaSyAeZnZ4tNZ7qY0cjfRdBq4J_Eahop37Qn4",

    authDomain:
      "dream-esports-51780.firebaseapp.com",

    projectId:
      "dream-esports-51780",

    storageBucket:
      "dream-esports-51780.firebasestorage.app",

    messagingSenderId:
      "959473187247",

    appId:
      "1:959473187247:web:ba4a80a6da5b52d5fcd75a",

    measurementId:
      "G-DP6X3STGN0"

  };


  const app =
    initializeApp(firebaseConfig);


  const auth =
    getAuth(app);


  const db =
    getFirestore(app);



  /* ================= LOGIN ================= */

  window.loginAdmin = async function() {

    const email =
      document
      .getElementById("email")
      .value
      .trim();


    const password =
      document
      .getElementById("password")
      .value;


    const message =
      document
      .getElementById("loginMessage");


    if (!email || !password) {

      message.innerText =
        "Enter email and password.";

      return;

    }


    message.innerText =
      "Logging in...";


    try {

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

      message.innerText = "";

    }

    catch(error) {

      console.error(error);

      message.innerText =
        "Login failed.";

    }

  };



  /* ================= AUTH ================= */

  onAuthStateChanged(auth, (user) => {

    if (user) {

      document
      .getElementById("loginScreen")
      .style.display = "none";


      document
      .getElementById("adminScreen")
      .style.display = "block";


      document
      .getElementById("adminEmail")
      .innerText =
        user.email;


      loadTournaments();

    }

    else {

      document
      .getElementById("loginScreen")
      .style.display = "flex";


      document
      .getElementById("adminScreen")
      .style.display = "none";

    }

  });



  /* ================= LOGOUT ================= */

  window.logoutAdmin = async function() {

    await signOut(auth);

  };



  /* ================= TOURNAMENTS ================= */

  window.loadTournaments = async function() {

    const list =
      document
      .getElementById("tournamentList");


    list.innerHTML =
      `<div class="loading">
        Loading tournaments...
      </div>`;


    try {

      const snapshot =
        await getDocs(
          collection(db, "Tournaments")
        );


      let total =
        snapshot.size;


      let open =
        0;


      let players =
        0;


      list.innerHTML = "";


      if (total === 0) {

        list.innerHTML =
          `<div class="empty">
            No tournaments found.
          </div>`;

      }


      snapshot.forEach((doc) => {

        const data =
          doc.data();


        const name =
          data.Name || "Unnamed Tournament";


        const game =
          data.Game || "Free Fire";


        const mode =
          data.Mode || "-";


        const date =
          data.Date || "-";


        const time =
          data.Time || "-";


        const maxPlayers =
          data.Maxplayers || 0;


        const currentPlayers =
          data.Players || 0;


        const status =
          data["Status "] ||
          data.Status ||
          "Open";


        if (
          String(status).toLowerCase()
          === "open"
        ) {

          open++;

        }


        players +=
          Number(currentPlayers) || 0;


        const card =
          document.createElement("div");


        card.className =
          "tournament-card";


        card.innerHTML = `

          <div class="tournament-name">
            ${name}
          </div>

          <div class="game">
            ${game}
          </div>

          <div class="info">

            <div class="info-box">

              <div class="info-label">
                MODE
              </div>

              <div class="info-value">
                ${mode}
              </div>

            </div>


            <div class="info-box">

              <div class="info-label">
                DATE
              </div>

              <div class="info-value">
                ${date}
              </div>

            </div>


            <div class="info-box">

              <div class="info-label">
                TIME
              </div>

              <div class="info-value">
                ${time}
              </div>

            </div>


            <div class="info-box">

              <div class="info-label">
                PLAYERS
              </div>

              <div class="info-value">
                ${currentPlayers}/${maxPlayers}
              </div>

            </div>

          </div>


          <div class="status">
            ${status}
          </div>

        `;


        list.appendChild(card);

      });


      document
      .getElementById("totalTournaments")
      .innerText = total;


      document
      .getElementById("openTournaments")
      .innerText = open;


      document
      .getElementById("totalPlayers")
      .innerText = players;

    }

    catch(error) {

      console.error(error);


      list.innerHTML =
        `<div class="empty">
          Failed to load tournaments.
          <br><br>
          Check Firestore rules.
        </div>`;

    }

  };

</script>

</body>
</html>
