<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dream eSports Admin</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #080808;
      color: #fff;
      min-height: 100vh;
    }

    /* ================= LOGIN ================= */

    #loginPage {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background:
        radial-gradient(circle at top, #302000, #080808 55%);
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      padding: 32px;
      border-radius: 22px;
      background: #111;
      border: 1px solid #303030;
      box-shadow: 0 0 40px rgba(255, 180, 0, 0.12);
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .logo span {
      color: #ffb000;
    }

    .subtitle {
      text-align: center;
      color: #888;
      margin-bottom: 28px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border-radius: 10px;
      border: 1px solid #333;
      outline: none;
      background: #1a1a1a;
      color: #fff;
      font-size: 15px;
    }

    input:focus {
      border-color: #ffb000;
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #ffb000;
      color: #000;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #loginError {
      color: #ff5c5c;
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      line-height: 1.5;
    }


    /* ================= APP ================= */

    #app {
      display: none;
    }

    header {
      height: 70px;
      padding: 0 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #101010;
      border-bottom: 1px solid #292929;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-title {
      font-size: 22px;
      font-weight: bold;
    }

    .header-title span {
      color: #ffb000;
    }

    .logout-btn {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      background: #242424;
      color: #fff;
      cursor: pointer;
    }

    .logout-btn:hover {
      background: #333;
    }

    main {
      width: 100%;
      max-width: 1200px;
      margin: auto;
      padding: 25px;
    }

    .welcome {
      margin-bottom: 25px;
    }

    .welcome h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .welcome p {
      color: #888;
    }


    /* ================= STATS ================= */

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: #111;
      border: 1px solid #292929;
      border-radius: 16px;
      padding: 22px;
    }

    .stat-card h3 {
      color: #888;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .stat-number {
      font-size: 32px;
      font-weight: bold;
      color: #ffb000;
    }


    /* ================= SECTION ================= */

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .section-header h2 {
      font-size: 22px;
    }

    .refresh-btn {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: #ffb000;
      color: #000;
      font-weight: bold;
      cursor: pointer;
    }


    /* ================= TOURNAMENT ================= */

    #tournamentList {
      display: grid;
      gap: 15px;
    }

    .tournament {
      background: #111;
      border: 1px solid #292929;
      border-radius: 16px;
      padding: 20px;
    }

    .tournament-top {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 18px;
    }

    .tournament-name {
      font-size: 19px;
      font-weight: bold;
    }

    .status {
      padding: 6px 12px;
      border-radius: 20px;
      background: #173b20;
      color: #63e77a;
      font-size: 12px;
      white-space: nowrap;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .info {
      background: #181818;
      border-radius: 10px;
      padding: 12px;
    }

    .info small {
      display: block;
      color: #777;
      margin-bottom: 6px;
      font-size: 12px;
    }

    .info strong {
      font-size: 14px;
      word-break: break-word;
    }

    .loading,
    .empty {
      text-align: center;
      padding: 40px 20px;
      color: #777;
      background: #111;
      border-radius: 15px;
      border: 1px solid #292929;
    }


    /* ================= MOBILE ================= */

    @media (max-width: 700px) {

      header {
        padding: 0 15px;
      }

      .header-title {
        font-size: 18px;
      }

      main {
        padding: 15px;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .info-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .tournament-top {
        flex-direction: column;
      }

      .status {
        width: fit-content;
      }
    }
  </style>
</head>

<body>


  <!-- ================= LOGIN PAGE ================= -->

  <div id="loginPage">

    <div class="login-box">

      <div class="logo">
        Dream <span>eSports</span>
      </div>

      <div class="subtitle">
        Admin Panel
      </div>

      <input
        type="email"
        id="email"
        placeholder="Admin Email"
        autocomplete="email"
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
        autocomplete="current-password"
      >

      <button
        class="login-btn"
        id="loginBtn"
      >
        LOGIN
      </button>

      <div id="loginError"></div>

    </div>

  </div>


  <!-- ================= ADMIN APP ================= -->

  <div id="app">

    <header>

      <div class="header-title">
        Dream <span>eSports</span> Admin
      </div>

      <button
        class="logout-btn"
        id="logoutBtn"
      >
        Logout
      </button>

    </header>


    <main>

      <div class="welcome">

        <h1>Dashboard</h1>

        <p>
          Manage and monitor Dream eSports tournaments.
        </p>

      </div>


      <!-- ================= STATISTICS ================= -->

      <div class="stats">

        <div class="stat-card">

          <h3>Total Tournaments</h3>

          <div
            class="stat-number"
            id="totalTournaments"
          >
            0
          </div>

        </div>


        <div class="stat-card">

          <h3>Open Tournaments</h3>

          <div
            class="stat-number"
            id="openTournaments"
          >
            0
          </div>

        </div>


        <div class="stat-card">

          <h3>Total Players</h3>

          <div
            class="stat-number"
            id="totalPlayers"
          >
            0
          </div>

        </div>

      </div>


      <!-- ================= TOURNAMENTS ================= -->

      <div class="section-header">

        <h2>Tournaments</h2>

        <button
          class="refresh-btn"
          id="refreshBtn"
        >
          Refresh
        </button>

      </div>


      <div id="tournamentList">

        <div class="loading">
          Loading tournaments...
        </div>

      </div>

    </main>

  </div>


  <!-- ================= FIREBASE ================= -->

  <script type="module">

    import {
      initializeApp
    } from
    "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


    import {
      getAuth,
      onAuthStateChanged,
      signInWithEmailAndPassword,
      signOut
    } from
    "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


    import {
      getFirestore,
      collection,
      getDocs
    } from
    "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


    /* ================= ADMIN FIREBASE CONFIG ================= */

    const firebaseConfig = {

      apiKey:
        "AIzaSyCCtt4laZ43sipr3v_M8SnWdmswlJ4dXUI",

      authDomain:
        "dream-esports-admin.firebaseapp.com",

      projectId:
        "dream-esports-admin",

      storageBucket:
        "dream-esports-admin.firebasestorage.app",

      messagingSenderId:
        "489749417915",

      appId:
        "1:489749417915:web:8ca1d0ab19a923c848fe9e",

      measurementId:
        "G-J35HJBH0GC"

    };


    /* ================= INITIALIZE FIREBASE ================= */

    const app =
      initializeApp(firebaseConfig);

    const auth =
      getAuth(app);

    const db =
      getFirestore(app);


    /* ================= ELEMENTS ================= */

    const loginPage =
      document.getElementById("loginPage");

    const appPage =
      document.getElementById("app");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const loginBtn =
      document.getElementById("loginBtn");

    const logoutBtn =
      document.getElementById("logoutBtn");

    const loginError =
      document.getElementById("loginError");

    const tournamentList =
      document.getElementById("tournamentList");

    const refreshBtn =
      document.getElementById("refreshBtn");


    /* ================= LOGIN ================= */

    loginBtn.addEventListener(
      "click",
      async () => {

        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;


        loginError.textContent = "";


        if (!email || !password) {

          loginError.textContent =
            "Enter email and password.";

          return;

        }


        loginBtn.disabled = true;

        loginBtn.textContent =
          "LOGGING IN...";


        try {

          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );

        }

        catch (error) {

          console.error(
            "Firebase Login Error:",
            error
          );

          loginError.textContent =
            "Login failed: " +
            error.code;

        }


        loginBtn.disabled = false;

        loginBtn.textContent =
          "LOGIN";

      }
    );


    /* ================= AUTH STATE ================= */

    onAuthStateChanged(
      auth,
      async (user) => {

        if (user) {

          loginPage.style.display =
            "none";

          appPage.style.display =
            "block";

          await loadTournaments();

        }

        else {

          loginPage.style.display =
            "flex";

          appPage.style.display =
            "none";

        }

      }
    );


    /* ================= LOGOUT ================= */

    logoutBtn.addEventListener(
      "click",
      async () => {

        try {

          await signOut(auth);

        }

        catch (error) {

          console.error(error);

        }

      }
    );


    /* ================= LOAD TOURNAMENTS ================= */

    async function loadTournaments() {

      tournamentList.innerHTML =
        `
        <div class="loading">
          Loading tournaments...
        </div>
        `;


      try {

        const snapshot =
          await getDocs(
            collection(
              db,
              "Tournaments"
            )
          );


        let total =
          0;

        let open =
          0;

        let players =
          0;


        tournamentList.innerHTML =
          "";


        if (snapshot.empty) {

          tournamentList.innerHTML =
            `
            <div class="empty">
              No tournaments found.
            </div>
            `;

        }


        snapshot.forEach(
          (doc) => {

            const data =
              doc.data();


            total++;


            const currentPlayers =
              Number(
                data.Players || 0
              );


            players +=
              currentPlayers;


            const status =
              data["Status "] ??
              data.Status ??
              "Open";


            if (
              String(status).toLowerCase() ===
              "open"
            ) {

              open++;

            }


            const card =
              document.createElement(
                "div"
              );


            card.className =
              "tournament";


            card.innerHTML = `

              <div class="tournament-top">

                <div class="tournament-name">
                  ${escapeHTML(
                    data.Name ||
                    "Unnamed Tournament"
                  )}
                </div>

                <div class="status">
                  ${escapeHTML(
                    String(status)
                  )}
                </div>

              </div>


              <div class="info-grid">

                <div class="info">
                  <small>Game</small>
                  <strong>
                    ${escapeHTML(
                      data.Game || "-"
                    )}
                  </strong>
                </div>


                <div class="info">
                  <small>Mode</small>
                  <strong>
                    ${escapeHTML(
                      data.Mode || "-"
                    )}
                  </strong>
                </div>


                <div class="info">
                  <small>Date</small>
                  <strong>
                    ${escapeHTML(
                      data.Date || "-"
                    )}
                  </strong>
                </div>


                <div class="info">
                  <small>Time</small>
                  <strong>
                    ${escapeHTML(
                      data.Time || "-"
                    )}
                  </strong>
                </div>


                <div class="info">
                  <small>Players</small>
                  <strong>
                    ${currentPlayers}
                    /
                    ${Number(
                      data.Maxplayers || 0
                    )}
                  </strong>
                </div>


                <div class="info">
                  <small>Entry Fee</small>
                  <strong>
                    ${Number(
                      data.entryfee || 0
                    )}
                  </strong>
                </div>


                <div class="info">
                  <small>Room ID</small>
                  <strong>
                    ${escapeHTML(
                      data.Roomid || "-"
                    )}
                  </strong>
                </div>


                <div class="info">
                  <small>Tournament ID</small>
                  <strong>
                    ${escapeHTML(
                      doc.id
                    )}
                  </strong>
                </div>

              </div>

            `;


            tournamentList.appendChild(
              card
            );

          }
        );


        document.getElementById(
          "totalTournaments"
        ).textContent =
          total;


        document.getElementById(
          "openTournaments"
        ).textContent =
          open;


        document.getElementById(
          "totalPlayers"
        ).textContent =
          players;

      }


      catch (error) {

        console.error(
          "Firestore Error:",
          error
        );


        tournamentList.innerHTML =
          `
          <div class="empty">

            Failed to load tournaments.

            <br><br>

            ${escapeHTML(
              error.code ||
              error.message
            )}

          </div>
          `;

      }

    }


    /* ================= REFRESH ================= */

    refreshBtn.addEventListener(
      "click",
      async () => {

        await loadTournaments();

      }
    );


    /* ================= HTML SECURITY ================= */

    function escapeHTML(value) {

      return String(value)

        .replaceAll(
          "&",
          "&amp;"
        )

        .replaceAll(
          "<",
          "&lt;"
        )

        .replaceAll(
          ">",
          "&gt;"
        )

        .replaceAll(
          '"',
          "&quot;"
        )

        .replaceAll(
          "'",
          "&#039;"
        );

    }

  </script>

</body>
</html>
